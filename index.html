<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NOUS – test inteligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f5f2ea; --card:#fffdf8; --ink:#1d2433; --ink2:#4a5366; --mute:#8a91a0;
  --line:#e2ddd0; --accent:#2f6f6a; --accent2:#e3efec; --gold:#b8862b; --gold2:#f6ecd8;
  --red:#b5523b; --red2:#f7e5df; --green:#3d7a46; --green2:#e3f0e3;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:"IBM Plex Sans",system-ui,sans-serif;font-size:16px;line-height:1.55}
body{background-image:radial-gradient(circle at 1px 1px, rgba(29,36,51,.06) 1px, transparent 0);background-size:22px 22px;min-height:100vh}
h1,h2,h3{font-family:"Fraunces",Georgia,serif;font-weight:600;line-height:1.2;margin:0 0 .5em}
h1{font-size:clamp(2rem,5vw,3.2rem);letter-spacing:-.01em}
h2{font-size:1.6rem}
h3{font-size:1.2rem}
p{margin:.4em 0 .9em}
.wrap{max-width:860px;margin:0 auto;padding:28px 18px 80px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:28px;box-shadow:0 1px 0 rgba(0,0,0,.02),0 10px 30px -18px rgba(29,36,51,.25)}
.card+.card{margin-top:18px}
.eyebrow{font-family:"IBM Plex Mono",monospace;font-size:.75rem;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:.6em}
.muted{color:var(--ink2)}
.small{font-size:.88rem}
.btn{appearance:none;border:0;background:var(--ink);color:#fff;font:600 1rem "IBM Plex Sans";padding:13px 24px;border-radius:999px;cursor:pointer;transition:transform .08s, background .2s}
.btn:hover{background:#2c3650}
.btn:active{transform:scale(.98)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.ghost:hover{border-color:var(--ink)}
.btn.accent{background:var(--accent)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:640px){.grid2{grid-template-columns:1fr}.card{padding:20px}}
label.f{display:block;font-weight:600;font-size:.92rem;margin-bottom:6px}
input[type=text],input[type=number],select{width:100%;font:inherit;padding:11px 13px;border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
input:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent2)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;cursor:pointer;font-size:.92rem;user-select:none}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.req{color:var(--red)}
.err{color:var(--red);font-size:.88rem;min-height:1.2em}
/* top bar */
.topbar{position:sticky;top:0;z-index:5;background:rgba(245,242,234,.92);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.topbar .in{max-width:860px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:14px}
.logo{font-family:"Fraunces";font-weight:700;letter-spacing:.08em}
.prog{flex:1;height:6px;background:var(--line);border-radius:9px;overflow:hidden}
.prog>i{display:block;height:100%;background:var(--accent);transition:width .4s}
.timer{font-family:"IBM Plex Mono";font-size:.95rem;padding:4px 10px;border-radius:8px;background:var(--accent2);color:var(--accent);min-width:64px;text-align:center}
.timer.warn{background:var(--red2);color:var(--red)}
/* items */
.q{font-size:1.25rem;font-weight:500;margin:6px 0 18px}
.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.opt{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:13px 16px;cursor:pointer;text-align:left;font:inherit;color:inherit;transition:border-color .15s, background .15s}
.opt:hover{border-color:var(--ink2)}
.opt.on{border-color:var(--accent);background:var(--accent2);box-shadow:inset 0 0 0 1px var(--accent)}
.opts.img{grid-template-columns:repeat(4,1fr)}
.opts.img .opt{padding:6px;display:flex;flex-direction:column;align-items:center}
.opts.img .opt small{font-family:"IBM Plex Mono";color:var(--mute);font-size:.72rem}
@media(max-width:560px){.opts{grid-template-columns:1fr}.opts.img{grid-template-columns:repeat(4,1fr);gap:6px}}
.dots{display:flex;flex-wrap:wrap;gap:6px;margin-top:18px}
.dot{width:26px;height:26px;border-radius:7px;border:1.5px solid var(--line);background:#fff;font:500 .72rem "IBM Plex Mono";cursor:pointer;color:var(--ink2)}
.dot.done{background:var(--ink);color:#fff;border-color:var(--ink)}
.dot.cur{outline:2px solid var(--accent);outline-offset:1px}
.matrix{display:grid;grid-template-columns:repeat(3,1fr);gap:0;max-width:330px;margin:0 auto 18px;border:2px solid var(--ink);background:#fff}
.matrix>div{border:1px solid #d6d2c6;aspect-ratio:1;display:flex;align-items:center;justify-content:center}
.matrix svg,.opt svg{width:100%;height:auto;display:block}
.qm{font-family:"Fraunces";font-size:2.6rem;color:var(--accent)}
.bigdigit{font-family:"Fraunces";font-size:6rem;text-align:center;min-height:9rem;display:flex;align-items:center;justify-content:center}
.numinput{font-family:"IBM Plex Mono";font-size:1.6rem;letter-spacing:.3em;text-align:center}
.series{font-family:"IBM Plex Mono";font-size:1.6rem;text-align:center;margin:10px 0 20px;letter-spacing:.04em;word-spacing:.2em}
.premise{background:var(--paper);border-left:3px solid var(--accent);padding:10px 14px;border-radius:0 10px 10px 0;margin-bottom:6px}
.concl{font-weight:600;margin:14px 0 16px}
.sym{width:52px;height:52px;display:inline-block}
.symrow{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.targets{display:flex;gap:10px;justify-content:center;padding:10px 16px;border:2px solid var(--ink);border-radius:12px;background:#fff}
.searchbox{display:flex;gap:4px;justify-content:center;padding:10px;border:1.5px dashed var(--mute);border-radius:12px;background:#fff}
.key{display:grid;grid-template-columns:repeat(9,1fr);border:2px solid var(--ink);border-radius:10px;overflow:hidden;background:#fff;max-width:520px;margin:0 auto}
.key>div{border-right:1px solid var(--line);text-align:center;padding:4px 0}
.key>div:last-child{border-right:0}
.key b{display:block;border-top:1px solid var(--line);font-family:"IBM Plex Mono";padding-top:2px}
.pad{display:grid;grid-template-columns:repeat(9,1fr);gap:6px;max-width:520px;margin:18px auto 0}
.pad button{padding:14px 0;font:600 1.2rem "IBM Plex Mono";border:1.5px solid var(--line);background:#fff;border-radius:10px;cursor:pointer}
.pad button:active{background:var(--accent2)}
@media(max-width:560px){.pad{grid-template-columns:repeat(5,1fr)}}
.flash-ok{animation:fok .3s}
.flash-bad{animation:fbad .3s}
@keyframes fok{0%{background:var(--green2)}100%{background:var(--card)}}
@keyframes fbad{0%{background:var(--red2)}100%{background:var(--card)}}
.example{background:var(--gold2);border-radius:12px;padding:14px 16px;margin:12px 0}
ul.clean{padding-left:1.1em;margin:.3em 0}
ul.clean li{margin:.25em 0}
/* results */
.hero{text-align:center;padding:36px 24px}
.iq{font-family:"Fraunces";font-size:clamp(4.5rem,14vw,7.5rem);font-weight:700;line-height:1;color:var(--ink)}
.cat{display:inline-block;margin-top:8px;padding:6px 14px;border-radius:999px;background:var(--accent2);color:var(--accent);font-weight:600}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:22px}
.kpi{background:var(--paper);border-radius:12px;padding:12px}
.kpi b{display:block;font-family:"Fraunces";font-size:1.5rem}
.kpi span{font-size:.8rem;color:var(--ink2)}
@media(max-width:560px){.kpis{grid-template-columns:1fr}}
.prow{display:grid;grid-template-columns:190px 1fr 46px;gap:12px;align-items:center;margin:12px 0}
.prow .lbl{font-weight:600;font-size:.95rem}
.prow .lbl small{display:block;font-weight:400;color:var(--mute);font-size:.75rem}
.track{position:relative;height:30px}
.track .zone{position:absolute;top:8px;height:14px;background:var(--line);border-radius:4px}
.track .base{position:absolute;top:14px;height:2px;left:0;right:0;background:var(--line)}
.track .mid{position:absolute;top:2px;bottom:2px;width:1px;background:var(--mute)}
.track .bar{position:absolute;top:10px;height:10px;border-radius:5px}
.track .pt{position:absolute;top:6px;width:18px;height:18px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1.5px var(--ink);transform:translateX(-50%)}
.prow .val{font-family:"Fraunces";font-weight:700;font-size:1.25rem;text-align:right}
@media(max-width:560px){.prow{grid-template-columns:1fr 46px}.prow .track{grid-column:1/3;grid-row:2}}
.scale{display:flex;justify-content:space-between;font:500 .7rem "IBM Plex Mono";color:var(--mute);margin-left:202px;margin-right:58px}
@media(max-width:560px){.scale{margin-left:0;margin-right:0}}
table.sub{width:100%;border-collapse:collapse;font-size:.92rem}
table.sub th{text-align:left;font-weight:600;color:var(--ink2);font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;border-bottom:1.5px solid var(--line);padding:8px 6px}
table.sub td{border-bottom:1px solid var(--line);padding:9px 6px;vertical-align:middle}
.ss{display:inline-flex;gap:2px}
.ss i{width:6px;height:14px;border-radius:2px;background:var(--line)}
.ss i.f{background:var(--accent)}
.tag{display:inline-block;font-size:.72rem;font-weight:600;padding:2px 8px;border-radius:999px}
.tag.s{background:var(--green2);color:var(--green)}
.tag.w{background:var(--red2);color:var(--red)}
.tag.nn{background:var(--paper);color:var(--ink2)}
.sw{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:640px){.sw{grid-template-columns:1fr}}
.swbox{border-radius:14px;padding:18px}
.swbox.s{background:var(--green2)}
.swbox.w{background:var(--gold2)}
.swbox h3{font-size:1.05rem}
.swbox .it{margin:10px 0}
.swbox .it b{display:block}
.idx{border-top:1px solid var(--line);padding-top:22px;margin-top:22px}
.idx:first-of-type{border-top:0;margin-top:6px;padding-top:4px}
.idxhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.idxhead .n{font-family:"Fraunces";font-size:2rem;font-weight:700}
.pm{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:12px 0}
@media(max-width:640px){.pm{grid-template-columns:1fr}}
.pm>div{border-radius:12px;padding:12px 14px}
.pm .p{background:var(--green2)}
.pm .m{background:var(--red2)}
.pm h4{margin:0 0 4px;font-size:.85rem;text-transform:uppercase;letter-spacing:.08em}
.pm .p h4{color:var(--green)} .pm .m h4{color:var(--red)}
.tips{background:var(--paper);border-radius:12px;padding:12px 16px}
.tips h4{margin:0 0 4px;font-size:.85rem;text-transform:uppercase;letter-spacing:.08em;color:var(--gold)}
.note{background:var(--gold2);border-radius:12px;padding:12px 16px;margin:10px 0;font-size:.93rem}
.insight{border-left:3px solid var(--accent);padding:4px 0 4px 14px;margin:14px 0}
.insight>b:first-child{display:block;margin-bottom:2px}
.refs li{margin:.35em 0;font-size:.88rem;color:var(--ink2)}
.center{text-align:center}
.fade{animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:.9rem;opacity:0;transition:opacity .3s;pointer-events:none;z-index:9}
.toast.on{opacity:1}
.feedback{text-align:center;font-weight:600;min-height:1.5em;margin-top:8px}
.modal{position:fixed;inset:0;background:rgba(29,36,51,.45);display:flex;align-items:center;justify-content:center;z-index:8;padding:18px}
.modal .card{max-width:440px}
</style>
</head>
<body>
<div class="topbar" id="topbar" style="display:none"><div class="in"><span class="logo">NOUS</span><div class="prog"><i id="progbar" style="width:0"></i></div><span class="small muted" id="secname"></span><span class="timer" id="timer" style="display:none"></span></div></div>
<div class="wrap" id="app"></div>
<div class="toast" id="toast"></div>
<script>
"use strict";
/* ============ utility ============ */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuffle(arr,rng){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor((rng?rng():Math.random())*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const $=s=>document.querySelector(s);
const app=$('#app');
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),2200)}
function fmtTime(s){s=Math.max(0,Math.ceil(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function normCdf(z){const t=1/(1+.2316419*Math.abs(z));const d=.3989423*Math.exp(-z*z/2);let p=d*t*(.3193815+t*(-.3565638+t*(1.781478+t*(-1.821256+t*1.330274))));return z>0?1-p:p}
function mean(a){return a.reduce((x,y)=>x+y,0)/a.length}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}

/* gender-aware text: {m|f} */
function gx(s){
  const g=S.p&&S.p.gender;
  return String(s).replace(/\{([^|}]*)\|([^}]*)\}/g,(m,a,b)=>g==='f'?b:g==='m'?a:(a+'/'+b));
}

/* ============ SVG shapes ============ */
const INK='#1d2433', GREY='#9aa3b2';
function polyPts(n,cx,cy,R,start){const p=[];for(let i=0;i<n;i++){const a=(start+i*360/n)*Math.PI/180;p.push((cx+R*Math.cos(a)).toFixed(2)+','+(cy+R*Math.sin(a)).toFixed(2))}return p.join(' ')}
function shapeSVG(t,cx,cy,s,rot,fill,sw){
  const f=fill==='none'?'#fff':fill==='grey'?GREY:INK;
  const st=`stroke="${INK}" stroke-width="${sw||2.2}" stroke-linejoin="round"`;
  let el='';
  switch(t){
    case 'circle': el=`<circle cx="${cx}" cy="${cy}" r="${s}" fill="${f}" ${st}/>`;break;
    case 'square': el=`<rect x="${cx-s*.86}" y="${cy-s*.86}" width="${s*1.72}" height="${s*1.72}" fill="${f}" ${st}/>`;break;
    case 'triangle': el=`<polygon points="${polyPts(3,cx,cy+s*.15,s*1.15,-90)}" fill="${f}" ${st}/>`;break;
    case 'diamond': el=`<polygon points="${polyPts(4,cx,cy,s*1.15,-90)}" fill="${f}" ${st}/>`;break;
    case 'pentagon': el=`<polygon points="${polyPts(5,cx,cy,s*1.05,-90)}" fill="${f}" ${st}/>`;break;
    case 'cross':{const a=s*.36,b=s*1.0;const P=[[-a,-b],[a,-b],[a,-a],[b,-a],[b,a],[a,a],[a,b],[-a,b],[-a,a],[-b,a],[-b,-a],[-a,-a]].map(([x,y])=>(cx+x).toFixed(2)+','+(cy+y).toFixed(2)).join(' ');el=`<polygon points="${P}" fill="${f}" ${st}/>`;break}
    case 'halfL': case 'halfR': case 'halfT': case 'halfB':{
      const d={halfL:`M${cx},${cy-s} A${s},${s} 0 0 0 ${cx},${cy+s} Z`,halfR:`M${cx},${cy-s} A${s},${s} 0 0 1 ${cx},${cy+s} Z`,halfT:`M${cx-s},${cy} A${s},${s} 0 0 1 ${cx+s},${cy} Z`,halfB:`M${cx-s},${cy} A${s},${s} 0 0 0 ${cx+s},${cy} Z`}[t];
      el=`<circle cx="${cx}" cy="${cy}" r="${s}" fill="#fff" ${st}/><path d="${d}" fill="${INK}"/>`;break}
  }
  if(rot)el=`<g transform="rotate(${rot} ${cx} ${cy})">${el}</g>`;
  return el;
}
const LAYOUT={1:[[50,50]],2:[[29,50],[71,50]],3:[[50,29],[28,68],[72,68]],4:[[29,29],[71,29],[29,71],[71,71]]};
const BASE_S={1:23,2:15,3:14,4:13};
function cellSVG(c){
  let inner='';
  if(c.lines!==undefined){
    const m=c.lines;
    for(let i=0;i<8;i++)if(m>>i&1){const a=i*45*Math.PI/180;inner+=`<line x1="50" y1="50" x2="${(50+36*Math.cos(a)).toFixed(1)}" y2="${(50+36*Math.sin(a)).toFixed(1)}" stroke="${INK}" stroke-width="3.2" stroke-linecap="round"/>`}
    const E=[[14,14,86,14],[86,14,86,86],[86,86,14,86],[14,86,14,14]];
    for(let i=0;i<4;i++)if(m>>(8+i)&1){const e=E[i];inner+=`<line x1="${e[0]}" y1="${e[1]}" x2="${e[2]}" y2="${e[3]}" stroke="${INK}" stroke-width="3.2" stroke-linecap="round"/>`}
    inner+=`<circle cx="50" cy="50" r="2.6" fill="${INK}"/>`;
  }else{
    const pos=LAYOUT[c.count], s=BASE_S[c.count]*(c.size||1);
    for(const [x,y] of pos) inner+=shapeSVG(c.shape,x,y,s,c.shape==='triangle'?c.rot:0,c.fill);
  }
  return `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">${inner}</svg>`;
}
function cellKey(c){if(c.lines!==undefined)return 'L'+c.lines;return [c.shape,c.count,c.fill,c.shape==='triangle'?c.rot:0,c.size||1].join('|')}

/* ============ MATRICES (Raven-like, rule-based) ============ */
const SH=['circle','square','triangle','diamond','pentagon','cross'];
const MATRIX_SPECS=[
  {lvl:1,f:(r,c)=>({shape:['circle','square','triangle'][r],count:c+1,fill:'none',rot:0})},
  {lvl:1,f:(r,c)=>({shape:['square','circle','diamond'][(r+c)%3],count:1,fill:['none','grey','black'][r],rot:0})},
  {lvl:1,f:(r,c)=>({shape:['triangle','circle','square'][(r+c)%3],count:[1,2,3][c],fill:'black',rot:0})},
  {lvl:1,f:(r,c)=>({shape:['pentagon','diamond','circle'][r],fill:['none','grey','black'][(r+c)%3],count:[1,2,3][(r+2*c)%3],rot:0})},
  {lvl:2,f:(r,c)=>({shape:['circle','triangle','cross'][(r+c)%3],count:[3,2,1][(r+2*c)%3],fill:['black','grey','none'][c],rot:0})},
  {lvl:2,f:(r,c)=>({shape:'triangle',rot:(c*90+r*45)%360,count:[1,2,3][(r+c)%3],fill:'grey'})},
  {lvl:2,f:(r,c)=>({shape:['square','pentagon','circle'][(r+c)%3],fill:['none','black','grey'][(r+2*c)%3],count:[1,2,3][r],rot:0})},
  {lvl:2,f:(r,c)=>({shape:['diamond','circle','triangle'][(r+2*c)%3],count:[1,2,3][(r+c)%3],fill:['grey','none','black'][(r+c)%3],size:[.62,.82,1][c],rot:0})},
  {lvl:3,lines:'or',seed:11},
  {lvl:3,f:(r,c)=>({shape:['cross','pentagon','diamond'][(r+c)%3],count:[1,2,3][(r+2*c)%3],fill:['none','grey','black'][(2*r+c)%3],rot:0})},
  {lvl:3,lines:'xor',seed:23},
  {lvl:3,lines:'and',seed:37},
];
function bits(m){let n=0;while(m){n+=m&1;m>>=1}return n}
function randMask(rng,k,excl){let m=0;let guard=0;while(bits(m)<k&&guard++<200){const b=Math.floor(rng()*12);if(!((excl>>b)&1))m|=1<<b}return m}
function buildLinesMatrix(spec){
  const rng=mulberry32(spec.seed);const rows=[];
  for(let r=0;r<3;r++){
    let a,b,o;
    for(let g=0;g<200;g++){
      if(spec.lines==='and'){const c=randMask(rng,2+Math.floor(rng()*2),0);const ra=randMask(rng,2,c);const rb=randMask(rng,2,c|ra);a=c|ra;b=c|rb;o=a&b}
      else{a=randMask(rng,3+Math.floor(rng()*2),0);b=randMask(rng,3+Math.floor(rng()*2),0);o=spec.lines==='or'?(a|b):(a^b)}
      if(bits(o)>=2&&a!==b&&o!==a&&o!==b&&(spec.lines!=='or'||(a&b)!==a&&(a&b)!==b))break;
    }
    rows.push([a,b,o]);
  }
  const cells=rows.flat().map(m=>({lines:m}));
  const ans=cells[8];const A=rows[2][0],B=rows[2][1];
  const cand=[A,B,A|B,A&B,A^B];
  for(let i=0;i<12;i++)cand.push(ans.lines^(1<<i));
  const seen=new Set([ans.lines]);const pri=[];const rest=[];
  cand.forEach((m,i)=>{if(m===0||seen.has(m))return;seen.add(m);(i<5?pri:rest).push(m)});
  const d=pri.concat(shuffle(rest,rng)).slice(0,7).map(m=>({lines:m}));
  return {cells,ans,dis:d,rng};
}
function buildAttrMatrix(spec,seed){
  const rng=mulberry32(seed);const cells=[];
  for(let r=0;r<3;r++)for(let c=0;c<3;c++)cells.push(spec.f(r,c));
  const ans=cells[8];
  const keys=['shape','count','fill','rot','size'];
  const val=(c,k)=>k==='size'?(c.size||1):c[k];
  const vary=keys.filter(k=>new Set(cells.map(c=>val(c,k))).size>1&&(k!=='rot'||ans.shape==='triangle'));
  const dom={shape:SH,count:[1,2,3,4],fill:['none','grey','black'],rot:[0,90,180,270,45,135],size:[.62,.82,1]};
  const seen=new Set([cellKey(ans)]);const c1=[],c2=[],c3=[];
  const push=(arr,c)=>{const k=cellKey(c);if(!seen.has(k)){seen.add(k);arr.push(c)}};
  for(const k of vary){for(const v of new Set(cells.map(c=>val(c,k))))if(v!==val(ans,k))push(c1,{...ans,[k]:v})}
  for(let i=0;i<vary.length;i++)for(let j=i+1;j<vary.length;j++){const ki=vary[i],kj=vary[j];
    for(const vi of new Set(cells.map(c=>val(c,ki))))for(const vj of new Set(cells.map(c=>val(c,kj))))if(vi!==val(ans,ki)&&vj!==val(ans,kj))push(c3,{...ans,[ki]:vi,[kj]:vj})}
  for(const k of keys){if(k==='rot'&&ans.shape!=='triangle')continue;for(const v of dom[k])if(v!==val(ans,k))push(c2,{...ans,[k]:v})}
  let d=shuffle(c1,rng).slice(0,5);
  d=d.concat(shuffle(c3,rng)).slice(0,6);
  d=d.concat(shuffle(c2,rng)).slice(0,7);
  return {cells,ans,dis:d,rng};
}
function buildMatrices(){
  return MATRIX_SPECS.map((sp,i)=>{
    const m=sp.lines?buildLinesMatrix(sp):buildAttrMatrix(sp,100+i*7);
    const opts=shuffle([m.ans,...m.dis],mulberry32(500+i));
    return {cells:m.cells.slice(0,8),opts,a:opts.indexOf(m.ans),lvl:sp.lvl,kind:sp.lines||'attr'};
  });
}

/* ============ MENTAL ROTATION (Shepard–Metzler, 2D) ============ */
const nrm=cs=>{const mx=Math.min(...cs.map(c=>c[0])),my=Math.min(...cs.map(c=>c[1]));return cs.map(([x,y])=>[x-mx,y-my]).sort((a,b)=>a[0]-b[0]||a[1]-b[1])};
const pkey=cs=>JSON.stringify(nrm(cs));
const r90=cs=>cs.map(([x,y])=>[y,-x]);
const rotK=(cs,k)=>{let r=cs;for(let i=0;i<((k%4)+4)%4;i++)r=r90(r);return nrm(r)};
const mir=cs=>nrm(cs.map(([x,y])=>[-x,y]));
const allT=cs=>{const s=new Set();for(let k=0;k<4;k++){s.add(pkey(rotK(cs,k)));s.add(pkey(rotK(mir(cs),k)))}return s};
function connected(cs){const set=new Set(cs.map(c=>c+''));const st=[cs[0]];const vis=new Set([cs[0]+'']);while(st.length){const [x,y]=st.pop();for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const k=[x+dx,y+dy]+'';if(set.has(k)&&!vis.has(k)){vis.add(k);st.push([x+dx,y+dy])}}}return vis.size===cs.length}
const ROT_SPECS=[
  {s:[[0,0],[0,1],[0,2],[0,3],[1,3]],tk:0,k:1,alt:false},
  {s:[[0,0],[1,0],[0,1],[1,1],[0,2]],tk:0,k:2,alt:false},
  {s:[[1,0],[2,0],[0,1],[1,1],[1,2]],tk:1,k:1,alt:false},
  {s:[[0,0],[0,1],[1,1],[1,2],[1,3]],tk:0,k:3,alt:false},
  {s:[[1,0],[0,1],[1,1],[1,2],[1,3]],tk:2,k:1,alt:true},
  {s:[[0,1],[1,1],[2,1],[2,2],[3,2],[1,0]],tk:1,k:2,alt:true},
  {s:[[0,0],[1,0],[2,0],[3,0],[3,1],[1,1],[1,2]],tk:3,k:1,alt:true},
  {s:[[0,0],[0,1],[1,1],[2,1],[2,2],[3,1]],tk:0,k:3,alt:true},
  {s:[[0,0],[1,0],[1,1],[1,2],[2,2],[3,2],[3,1],[1,3]],tk:2,k:3,alt:true},
  {s:[[0,1],[1,1],[1,0],[2,0],[2,1],[2,2],[3,2]],tk:1,k:2,alt:true},
];
function buildRotations(){
  return ROT_SPECS.map((sp,i)=>{
    const rng=mulberry32(900+i*13);
    const base=nrm(sp.s);
    const target=rotK(base,sp.tk);
    const correct=rotK(base,sp.tk+sp.k);
    const mj=shuffle([0,1,2,3],rng);
    const dis=[];const seen=new Set([pkey(correct)]);
    for(const j of mj){const m=rotK(mir(base),j);const k=pkey(m);if(!seen.has(k)){seen.add(k);dis.push(m)}if(dis.length>=(sp.alt?2:3))break}
    if(sp.alt){
      const forb=allT(base);let found=null;
      const order=shuffle(base.map((_,ix)=>ix),rng);
      outer:for(const ix of order){const rest=base.filter((_,j)=>j!==ix);
        const nb=[];rest.forEach(([x,y])=>[[1,0],[-1,0],[0,1],[0,-1]].forEach(([dx,dy])=>nb.push([x+dx,y+dy])));
        for(const p of shuffle(nb,rng)){if(rest.some(c=>c[0]===p[0]&&c[1]===p[1]))continue;if(p[0]===base[ix][0]&&p[1]===base[ix][1])continue;const cand=nrm([...rest,p]);if(!connected(cand))continue;if(forb.has(pkey(cand)))continue;found=cand;break outer}}
      if(found)dis.push(rotK(found,Math.floor(rng()*4)));
    }
    const opts=shuffle([correct,...dis],rng);
    return {target,opts,a:opts.indexOf(correct),n:base.length};
  });
}
function polySVG(cs,hue){
  const W=Math.max(...cs.map(c=>c[0]))+1,H=Math.max(...cs.map(c=>c[1]))+1;
  const u=Math.min(96/Math.max(W,H),22);const ox=(120-W*u)/2,oy=(120-H*u)/2;
  let s='';for(const [x,y] of cs){s+=`<rect x="${(ox+x*u).toFixed(1)}" y="${(oy+y*u).toFixed(1)}" width="${u.toFixed(1)}" height="${u.toFixed(1)}" fill="${hue||'#2f6f6a'}" stroke="#fff" stroke-width="1.6" rx="2"/>`}
  return `<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">${s}</svg>`;
}

const EDU=['Základní','Střední bez maturity (výuční list)','Střední s maturitou','Vyšší odborné / bakalářské','Magisterské / inženýrské','Doktorské (Ph.D.)'];

function chipGroup(key,vals){return `<div class="chips" data-k="${key}">${vals.map(v=>`<span class="chip${intake[key]===v[0]?' on':''}" onclick="pickChip('${key}','${v[0]}',this)">${v[1]}</span>`).join('')}</div>`}

function submitIntake(e){
  e.preventDefault();
  const name=$('#name').value.trim(),age=parseInt($('#age').value,10);
  if(!name){$('#err').textContent='Vyplň prosím jméno.';return false}

  S={p:{name,age,gender:intake.gender,edu:$('#edu').value,field:$('#field').value.trim(),native:intake.native,fatigue:+intake.fatigue,exp:intake.exp,device:intake.device,env:intake.env},step:1,raw:{},used:{},detail:{},startedAt:Date.now()};
  prepItems();
  sectionIntro(0);
  return false;
}
function sectionIntro(i){
  stopTimer();setKeys(null);setTimer(null);
  const sec=SECTIONS[i];
  setTop(true,`${i+1}/${SECTIONS.length} · ${sec.name}`,i/SECTIONS.length);
  const lim=sec.limit?(sec.type==='ssearch'||sec.type==='coding'?'90 sekund':'limit '+Math.round(sec.limit/60)+' min'):'bez časového limitu';
  const count={mc:sec.id==='analog'?ANALOG.length:sec.id==='vocab'?VOCAB.length:LOGIC.length,matrix:MATS.length,num:SERIES.length,rotate:ROTS.length}[sec.type];
  app.innerHTML=`<div class="card fade">
    <div class="eyebrow">Oddíl ${i+1} z ${SECTIONS.length}${count?' · '+count+' úloh':''} · ${lim}</div>
    <h2>${sec.name}</h2>
    <p>${sec.intro}</p>
    <div class="example">${sec.ex}</div>
    ${i===0?`<p class="small muted">${esc(S.p.name)}, úlohy jsou seřazeny od nejlehčích po nejtěžší. Na konci je normální nevědět – test je navržen tak, aby i velmi schopní lidé narazili na strop.</p>`:''}
    <div class="row" style="margin-top:14px"><button class="btn accent" onclick="startSection(${i})">Začít oddíl</button></div>
  </div>`;
  window.scrollTo(0,0);
}
function startSection(i){
  const sec=SECTIONS[i];
  if(sec.type==='digit')return digitStart(i);
  if(sec.type==='ssearch')return ssPractice(i);
  if(sec.type==='coding')return codPractice(i);
  const items=sec.type==='matrix'?MATS:sec.type==='rotate'?ROTS:sec.type==='num'?SERIES:sec.id==='analog'?ANALOG_O:sec.id==='vocab'?VOCAB_O:LOGIC;
  cur={i,sec,items,idx:0,ans:new Array(items.length).fill(null),t0:Date.now(),end:Date.now()+sec.limit*1000};
  setTimer(sec.limit);
  tick=setInterval(()=>{const left=(cur.end-Date.now())/1000;setTimer(left);if(left<=0){finishItems(true)}},250);
  renderItem();
}
function renderItem(){
  const {sec,items,idx}=cur;const it=items[idx];let body='';
  const sel=cur.ans[idx];
  if(sec.type==='mc'){
    if(sec.id==='logic'){
      body=`<div class="small muted" style="margin-bottom:8px">Předpoklady:</div>${it.p.map(x=>`<div class="premise">${esc(x)}</div>`).join('')}
      <div class="concl">Závěr: „${esc(it.c)}“</div><div class="small muted" style="margin-bottom:10px">Plyne závěr nutně z předpokladů?</div>
      <div class="opts">${['Ano','Ne'].map(o=>`<button class="opt${sel===o?' on':''}" onclick="choose('${o}')">${o==='Ano'?'Ano, nutně plyne':'Ne, nutně neplyne'}</button>`).join('')}</div>`;
    }else{
      const q=sec.id==='vocab'?`Které slovo má nejbližší význam slovu <b>„${esc(it.q)}“</b>?`:`<span style="font-family:'Fraunces';font-size:1.5rem">${esc(it.q)}</span>`;
      body=`<div class="q">${q}</div><div class="opts">${it.o.map(o=>`<button class="opt${sel===o?' on':''}" onclick="choose(${JSON.stringify(o).replace(/"/g,'&quot;')})">${esc(o)}</button>`).join('')}</div>`;
    }
  }else if(sec.type==='matrix'){
    body=`<div class="matrix">${it.cells.map(c=>`<div>${cellSVG(c)}</div>`).join('')}<div><span class="qm">?</span></div></div>
    <div class="opts img">${it.opts.map((o,k)=>`<button class="opt${sel===k?' on':''}" onclick="choose(${k})">${cellSVG(o)}<small>${k+1}</small></button>`).join('')}</div>`;
  }else if(sec.type==='rotate'){
    body=`<div class="row" style="justify-content:center;gap:18px;align-items:center;margin-bottom:16px"><div style="width:150px;border:2px solid var(--ink);border-radius:12px;background:#fff;padding:6px">${polySVG(it.target,'#1d2433')}</div></div>
    <div class="small muted center" style="margin-bottom:8px">Který z tvarů je vzor – pouze otočený?</div>
    <div class="opts img">${it.opts.map((o,k)=>`<button class="opt${sel===k?' on':''}" onclick="choose(${k})">${polySVG(o)}<small>${String.fromCharCode(65+k)}</small></button>`).join('')}</div>`;
  }else if(sec.type==='num'){
    body=`<div class="series">${it.q.join(', ')}, <span style="color:var(--accent)">?</span></div>
    <div style="max-width:220px;margin:0 auto"><input type="text" inputmode="numeric" class="numinput" id="numin" value="${sel===null?'':sel}" oninput="numIn(this)" onkeydown="if(event.key==='Enter'){nextItem()}" autocomplete="off"></div>`;
  }
  const last=idx===items.length-1;
  app.innerHTML=`<div class="card fade" id="itemcard">
    <div class="row between"><div class="eyebrow" style="margin:0">Úloha ${idx+1} / ${items.length}</div></div>
    <div style="margin-top:12px">${body}</div>
    <div class="row between" style="margin-top:20px">
      <button class="btn ghost" onclick="prevItem()" ${idx===0?'disabled':''}>← Zpět</button>
      ${last?`<button class="btn accent" onclick="confirmFinish()">Dokončit oddíl ✓</button>`:`<button class="btn" onclick="nextItem()">${sel===null||sel===''?'Přeskočit':'Další'} →</button>`}
    </div>
    <div class="dots">${items.map((_,k)=>`<button class="dot${cur.ans[k]!==null&&cur.ans[k]!==''?' done':''}${k===idx?' cur':''}" onclick="goItem(${k})">${k+1}</button>`).join('')}</div>
  </div>`;
  if(sec.type==='num')setTimeout(()=>{const e=$('#numin');if(e){e.focus();e.setSelectionRange(e.value.length,e.value.length)}},30);
  setKeys(e=>{
    if(e.target.tagName==='INPUT')return;
    if(sec.type==='matrix'&&/^[1-8]$/.test(e.key))choose(+e.key-1);
    if(sec.type==='rotate'&&/^[a-dA-D]$/.test(e.key))choose(e.key.toUpperCase().charCodeAt(0)-65);
    if(e.key==='ArrowRight'&&!last)nextItem();
    if(e.key==='ArrowLeft'&&idx>0)prevItem();
  });
}
function choose(v){cur.ans[cur.idx]=v;if(cur.idx<cur.items.length-1){renderItem();setTimeout(()=>nextItem(),220)}else renderItem()}
function numIn(el){el.value=el.value.replace(/[^\d-]/g,'');cur.ans[cur.idx]=el.value===''?null:el.value;
  const b=document.querySelectorAll('#itemcard .btn')[1];if(b&&b.textContent.includes('→'))b.textContent=(el.value?'Další':'Přeskočit')+' →';
  document.querySelectorAll('.dot')[cur.idx].classList.toggle('done',!!el.value)}
function nextItem(){if(cur.idx<cur.items.length-1){cur.idx++;renderItem()}else confirmFinish()}
function prevItem(){if(cur.idx>0){cur.idx--;renderItem()}}
function goItem(k){cur.idx=k;renderItem()}
function confirmFinish(){
  const empty=cur.ans.filter(a=>a===null||a==='').length;
  if(empty===0)return finishItems(false);
  const m=document.createElement('div');m.className='modal';
  m.innerHTML=`<div class="card"><h3>Dokončit oddíl?</h3><p>Neodpověděl{|a} jsi na ${empty} ${empty===1?'úlohu':empty<5?'úlohy':'úloh'}. Pokud nevíš, tip je lepší než nic – špatná odpověď se nepenalizuje.</p><div class="row between"><button class="btn ghost" id="mback">Vrátit se</button><button class="btn accent" id="mok">Dokončit</button></div></div>`.replace('Neodpověděl{|a}',gx('Neodpověděl{|a}'));
  document.body.appendChild(m);
  $('#mback').onclick=()=>m.remove();$('#mok').onclick=()=>{m.remove();finishItems(false)};
}
function finishItems(timeout){
  stopTimer();setKeys(null);
  document.querySelectorAll('.modal').forEach(x=>x.remove());
  const {sec,items,ans}=cur;let score=0;const correct=[];
  items.forEach((it,k)=>{let ok=false;
    if(sec.type==='mc')ok=ans[k]===it.a;
    else if(sec.type==='num')ok=ans[k]!==null&&parseInt(ans[k],10)===it.a;
    else ok=ans[k]===it.a;
    correct.push(ok);if(ok)score++});
  S.raw[sec.id]=score;S.used[sec.id]=Math.min(sec.limit,(Date.now()-cur.t0)/1000);
  S.detail[sec.id]={correct,answered:ans.filter(a=>a!==null&&a!=='').length,timeout};
  nextSection(timeout?`Čas vypršel – oddíl „${sec.name}“ je uzavřen.`:null);
}
function nextSection(msg){
  const i=SECTIONS.findIndex(s=>s.id===(cur&&cur.sec?cur.sec.id:''));
  cur=null;
  const n=i+1;S.step=n+1;
  if(msg)toast(msg);
  if(n>=SECTIONS.length)return screenResults();
  sectionIntro(n);
}

/* ---------- DIGIT SPAN ---------- */
function digitStart(i){
  cur={i,sec:SECTIONS[i],t0:Date.now(),phase:'fwd',len:3,trial:0,fails:0,res:{fwd:[],bwd:[]},maxF:0,maxB:0};
  digitPhaseIntro();
}
function digitPhaseIntro(){
  const f=cur.phase==='fwd';
  app.innerHTML=`<div class="card fade center"><div class="eyebrow">${f?'Část 1 · vpřed':'Část 2 · pozpátku'}</div>
  <h2>${f?'Zapiš čísla ve stejném pořadí':'Zapiš čísla POZPÁTKU'}</h2>
  <p class="muted">${f?'Začínáme třemi číslicemi.':'Začínáme dvěma číslicemi. Poslední zobrazenou číslici napiš jako první.'}</p>
  <button class="btn accent" onclick="digitTrial()">Spustit</button></div>`;
}
function genDigits(n){const a=[];while(a.length<n){const d=1+Math.floor(Math.random()*9);if(a.length&&(d===a[a.length-1]||Math.abs(d-a[a.length-1])===1&&Math.random()<.5))continue;a.push(d)}return a}
function digitTrial(){
  const seq=genDigits(cur.len);cur.seq=seq;
  app.innerHTML=`<div class="card center"><div class="eyebrow">${cur.phase==='fwd'?'Vpřed':'Pozpátku'} · ${cur.len} číslic · pokus ${cur.trial+1}/2</div><div class="bigdigit" id="bd">·</div></div>`;
  let k=0;const bd=$('#bd');
  const show=()=>{if(k>=seq.length){bd.textContent='';setTimeout(digitInput,350);return}bd.textContent=seq[k];setTimeout(()=>{bd.textContent='';k++;setTimeout(show,200)},800)};
  setTimeout(show,700);
}
function digitInput(){
  app.innerHTML=`<div class="card center fade"><div class="eyebrow">${cur.phase==='fwd'?'Vpřed':'Pozpátku'} · ${cur.len} číslic</div>
  <h3>${cur.phase==='fwd'?'Napiš číslice ve stejném pořadí':'Napiš číslice pozpátku'}</h3>
  <div style="max-width:300px;margin:14px auto"><input type="text" inputmode="numeric" class="numinput" id="din" autocomplete="off" onkeydown="if(event.key==='Enter')digitSubmit()"></div>
  <button class="btn" onclick="digitSubmit()">Potvrdit</button></div>`;
  setTimeout(()=>$('#din').focus(),30);
}
function digitSubmit(){
  const v=$('#din').value.replace(/\D/g,'');
  const target=(cur.phase==='fwd'?cur.seq:cur.seq.slice().reverse()).join('');
  const ok=v===target;
  cur.res[cur.phase].push({len:cur.len,ok});
  if(ok){if(cur.phase==='fwd')cur.maxF=Math.max(cur.maxF,cur.len);else cur.maxB=Math.max(cur.maxB,cur.len)}else cur.fails++;
  cur.trial++;
  const maxLen=cur.phase==='fwd'?9:8;
  if(cur.trial===2){
    const bothFail=cur.fails===2;cur.trial=0;cur.fails=0;
    if(bothFail||cur.len===maxLen){
      if(cur.phase==='fwd'){cur.phase='bwd';cur.len=2;return digitPhaseIntro()}
      return digitFinish();
    }
    cur.len++;
  }
  app.innerHTML=`<div class="card center"><div class="bigdigit" style="font-size:2rem;min-height:6rem">…</div></div>`;
  setTimeout(digitTrial,600);
}
function digitFinish(){
  S.raw.dfwd=cur.res.fwd.filter(x=>x.ok).length;S.raw.dbwd=cur.res.bwd.filter(x=>x.ok).length;
  S.detail.digit={maxF:cur.maxF,maxB:cur.maxB};S.used.digit=(Date.now()-cur.t0)/1000;
  nextSection(null);
}

/* ---------- SYMBOL SEARCH ---------- */
function ssGen(){
  const pool=shuffle(GLYPHS.map((_,i)=>i));const t=pool.slice(0,2);const g=pool.slice(2,7);
  const yes=Math.random()<.5;if(yes)g[Math.floor(Math.random()*5)]=t[Math.floor(Math.random()*2)];
  return {t,g,yes};
}
function ssRender(tr,info){
  return `<div class="row between"><div class="eyebrow" style="margin:0">${info}</div></div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:14px;margin-top:14px">
   <div class="targets">${tr.t.map(glyphSVG).join('')}</div>
   <div class="searchbox">${tr.g.map(glyphSVG).join('')}</div>
   <div class="row" style="gap:14px"><button class="btn accent" style="min-width:120px" onclick="ssAns(true)">← ANO</button><button class="btn" style="min-width:120px" onclick="ssAns(false)">NE →</button></div>
   <div class="feedback" id="fb"></div></div>`;
}
function ssPractice(i){
  cur={i,sec:SECTIONS[i],practice:4,tr:ssGen(),ok:0,bad:0,n:0};
  app.innerHTML=`<div class="card" id="sc">${ssRender(cur.tr,'Cvičná úloha 1 / 4')}</div>`;
  setKeys(ssKey);
}
function ssKey(e){if(e.key==='ArrowLeft'||e.key==='a'||e.key==='A'){e.preventDefault();ssAns(true)}if(e.key==='ArrowRight'||e.key==='n'||e.key==='N'){e.preventDefault();ssAns(false)}}
function ssAns(v){
  if(!cur||cur.lock)return;
  const ok=v===cur.tr.yes;
  if(cur.practice>0){
    cur.lock=true;$('#fb').innerHTML=ok?'<span style="color:var(--green)">Správně</span>':`<span style="color:var(--red)">Chyba – správně: ${cur.tr.yes?'ANO':'NE'}</span>`;
    setTimeout(()=>{cur.lock=false;cur.practice--;if(cur.practice===0)return ssReady();cur.tr=ssGen();$('#sc').innerHTML=ssRender(cur.tr,`Cvičná úloha ${5-cur.practice} / 4`)},900);return;
  }
  cur.n++;if(ok)cur.ok++;else cur.bad++;
  const c=$('#sc');c.classList.remove('flash-ok','flash-bad');void c.offsetWidth;c.classList.add(ok?'flash-ok':'flash-bad');
  cur.tr=ssGen();c.innerHTML=ssRender(cur.tr,`Vyřešeno: ${cur.n}`);
}
function ssReady(){
  setKeys(null);
  app.innerHTML=`<div class="card center fade"><h2>Výborně, teď naostro</h2><p>90 sekund. Co nejrychleji a nejpřesněji.<br><b>←</b> / A = ANO, <b>→</b> / N = NE</p><button class="btn accent" onclick="ssGo()">Start</button></div>`;
}
function ssGo(){
  cur.practice=0;cur.tr=ssGen();cur.t0=Date.now();cur.end=Date.now()+90000;
  app.innerHTML=`<div class="card" id="sc">${ssRender(cur.tr,'Vyřešeno: 0')}</div>`;
  setKeys(ssKey);setTimer(90);
  tick=setInterval(()=>{const l=(cur.end-Date.now())/1000;setTimer(l);if(l<=0){stopTimer();setKeys(null);
    S.raw.ssearch=Math.max(0,cur.ok-cur.bad);S.detail.ssearch={ok:cur.ok,bad:cur.bad,n:cur.n};S.used.ssearch=90;nextSection('Čas vypršel – hledání symbolů ukončeno.')}},200);
}

/* ---------- CODING (SDMT / WAIS Coding) ---------- */
function codRender(info){
  return `<div class="eyebrow">${info}</div>
  <div class="key">${cur.key.map((g,d)=>`<div>${glyphSVG(g).replace('class="sym"','class="sym" style="width:100%;height:auto;max-width:44px"')}<b>${d+1}</b></div>`).join('')}</div>
  <div style="display:flex;justify-content:center;margin-top:22px"><div style="border:2px solid var(--ink);border-radius:14px;padding:10px;background:#fff">${glyphSVG(cur.key[cur.target]).replace('class="sym"','class="sym" style="width:90px;height:90px"')}</div></div>
  <div class="pad">${[1,2,3,4,5,6,7,8,9].map(d=>`<button onclick="codAns(${d})">${d}</button>`).join('')}</div>

function score(){
  const p=S.p;const z={},ss={};
  for(const k in SUBTESTS){
    let [m,sd]=NORMS[k];const dom=DOMAIN[k];
    m=m+ageOffset(dom,p.age)*sd;
    if(dom==='gs'){if(p.device==='telefon')m*=.85;else if(p.device==='tablet')m*=.92}
    const raw=S.raw[k]||0;
    z[k]=clamp((raw-m)/sd,-3,3);ss[k]=clamp(Math.round(10+3*z[k]),1,19);
  }
  const idx={};
  for(const I in INDEXES){const ks=Object.keys(SUBTESTS).filter(k=>SUBTESTS[k].idx===I);idx[I]=Math.round(clamp(100+15*mean(ks.map(k=>z[k]))/0.88,50,150))}
  const all=Object.keys(SUBTESTS);
  const fsZ=mean(all.map(k=>z[k]))/0.678;
  const gaiK=all.filter(k=>['gc','gf'].includes(DOMAIN[k])),cpiK=all.filter(k=>['wm','gs'].includes(DOMAIN[k]));
  const gai=Math.round(clamp(100+15*mean(gaiK.map(k=>z[k]))/0.736,50,150));
  const cpi=Math.round(clamp(100+15*mean(cpiK.map(k=>z[k]))/0.716,50,150));
  const iq=Math.round(clamp(100+15*fsZ,50,150));
  return {z,ss,idx,iq,gai,cpi};
}

  if(vci-nonv>=12)ins.push(['Verbálně orientovaný styl myšlení','Se slovy a pojmy pracuješ výrazně lépe než s abstraktními vizuálními a číselnými vzorci. Nejlépe se učíš čtením a výkladem; nové technické problémy si pomáhej převádět do slov („nejdřív se mění tvar, pak počet…“).']);
  if(nonv-vci>=12)ins.push(['Analyticko-vizuální styl myšlení','Abstraktní vzorce, čísla a logika ti jdou výrazně lépe než slovní úlohy. Typické pro technicky a přírodovědně zaměřené lidi'+(p.native==='ne'?' – a také pro lidi, jejichž mateřštinou není čeština':'')+'. Nejlépe se učíš z diagramů, příkladů a vlastního zkoušení.']);
  if(R.gai-R.cpi>=12)ins.push(['Uvažování silnější než „výkonnostní nástroje“',`Tvé schopnosti uvažování (GAI ${R.gai}) jsou výrazně vyšší než pracovní paměť a rychlost (CPI ${R.cpi}). Ve WAIS-IV se tento rozdíl sleduje právě proto, že u takových lidí podceňuje časový tlak jejich skutečné možnosti. Nejlepší výkon podáš v klidu, s možností poznámek a bez spěchu.`]);
  if(R.cpi-R.gai>=12)ins.push(['Rychlý a výkonný zpracovatel',`Pracovní paměť a rychlost (CPI ${R.cpi}) jsou silnější než tvé abstraktní uvažování (GAI ${R.gai}). Prakticky to znamená, že zvládáš velké množství informací a rutinní práci rychle a efektivně. Rezervy jsou spíš v hloubce abstrakce – tam se vyplatí zpomalit a postupovat systematicky.`]);
  if(R.idx.PSI<=Math.min(R.idx.PRI,R.idx.VCI,R.idx.QRI)-12)ins.push(['Přesnost před rychlostí','Rychlost zpracování je tvou nejslabší oblastí vzhledem k uvažování. Myslíš dobře, ale potřebuješ na to čas. U rychlostních testů hraje velkou roli také zařízení – na telefonu nebo touchpadu je výkon přirozeně nižší.']);

  /* error analysis */
  const ea=[];
  const L=S.detail.logic;if(L){
    const wrongTags=LOGIC.map((x,k)=>L.correct[k]?null:x.tag).filter(Boolean);
    if(wrongTags.includes('potvrzení důsledku'))ea.push('<b>Logika – klam potvrzení důsledku:</b> z „když prší, je mokro“ a „je mokro“ ještě neplyne, že pršelo (mohlo se kropit). Tento klam dělá v laboratorních studiích i většina vysokoškoláků.');
    if(wrongTags.includes('belief bias'))ea.push('<b>Logika – belief bias:</b> úsudek o lodích je logicky platný, i když je závěr ve skutečnosti nepravdivý. Mozek má sklon hodnotit argumenty podle uvěřitelnosti závěru – dobré si to hlídat třeba u reklam nebo politických argumentů.');
    if(wrongTags.includes('nedovolené zobecnění'))ea.push('<b>Logika – nedovolené zobecnění:</b> z toho, že „některé B mají vlastnost X“, neplyne nic o konkrétní podskupině A. Zkus si takové úsudky kreslit jako Vennovy diagramy.');
    if(!wrongTags.length)ea.push('<b>Logika:</b> všechny úsudky správně – včetně záludných typů (potvrzení důsledku, belief bias), na kterých chybuje většina lidí. Výborná disciplína myšlení.');
  }
  const M=S.detail.matrix;if(M){const by=l=>{const ks=MATS.map((m,k)=>m.lvl===l?k:-1).filter(k=>k>=0);return [ks.filter(k=>M.correct[k]).length,ks.length]};const [a1,n1]=by(1),[a2,n2]=by(2),[a3,n3]=by(3);
    let t=`<b>Matice:</b> lehké ${a1}/${n1}, střední ${a2}/${n2}, těžké ${a3}/${n3}. `;
    if(a1<n1-1)t+='Chyby už v lehkých úlohách často znamenají spěch nebo nepozornost – vyplatí se prohlédnout celý řádek i sloupec.';
    else if(a3>=n3-1)t+='Zvládl{|a} jsi i nejtěžší úlohy s více pravidly a operacemi s čarami – to je doména nadprůměrně schopných řešitelů.';
    else if(a2>=n2-1)t+='Spolehlivě zvládáš úlohy se dvěma pravidly; rezerva je u úloh, kde se kombinují tři pravidla nebo operace s čarami (sčítání, rozdíl, průnik).';
    else t+='Hranice leží u úloh s více současně platnými pravidly – zkus příště každou vlastnost analyzovat zvlášť.';
    ea.push(t)}
  const SE=S.detail.series;if(SE){const wrong=[...new Set(SERIES.map((x,k)=>SE.correct[k]?null:x.t).filter(Boolean))];if(wrong.length)ea.push(`<b>Číselné řady:</b> potíže dělaly typy: ${wrong.join(', ')}.`);else ea.push('<b>Číselné řady:</b> všechny správně – včetně faktoriálu a kombinovaných operací.')}
  const D=S.detail.digit;if(D){let t=`<b>Pracovní paměť:</b> nejdelší správná řada vpřed <b>${D.maxF||'–'}</b>, pozpátku <b>${D.maxB||'–'}</b> číslic (typicky 6–7 vpřed a 4–5 pozpátku). `;
    if(D.maxF-D.maxB>=3)t+='Velký rozdíl mezi vpřed a pozpátku ukazuje, že udržet informace zvládáš lépe než s nimi manipulovat – zkus si při pozpátku číslice „vizualizovat“ jako řádek a číst ho zprava.';
    else if(D.maxB>=D.maxF-1&&D.maxB>=5)t+='Malý rozdíl mezi vpřed a pozpátku svědčí o dobré schopnosti s informacemi aktivně pracovat.';
    ea.push(t)}
  const SS=S.detail.ssearch;if(SS){const acc=SS.n?Math.round(SS.ok/SS.n*100):0;let t=`<b>Hledání symbolů:</b> ${SS.n} odpovědí, přesnost ${acc} %. `;
    if(acc<85)t+='Přesnost pod 85 % naznačuje, že jsi upřednostnil{|a} rychlost – chyby se odečítají, takže by pomohlo mírně zpomalit.';
    else if(acc>=97)t+='Velmi vysoká přesnost – pracuješ pečlivě; případná rezerva je jen v tempu.';
    else t+='Dobrý poměr rychlosti a přesnosti.';ea.push(t)}

  /* context notes */
  const notes=[];
  notes.push(`Výsledky jsou přepočteny na orientační normy pro věk <b>${p.age} let</b> – každá oblast se s věkem vyvíjí jinak (fluidní uvažování a rychlost od cca 30 let pozvolna klesají, slovní zásoba roste).`);
  if(p.age<16)notes.push('Ve věku pod 16 let se schopnosti ještě rychle vyvíjejí a orientační normy jsou méně přesné.');
  if(p.native==='ne')notes.push('Čeština není tvůj mateřský jazyk – verbální oblast proto pravděpodobně <b>podhodnocuje</b> tvé schopnosti. Spolehlivějším ukazatelem je pro tebe neverbální uvažování.');
  if(p.fatigue>=3)notes.push('Uvedl{|a} jsi únavu – ta prokazatelně snižuje hlavně pracovní paměť a rychlost. Skutečný výsledek může být o několik bodů vyšší.');
  if(p.exp==='často')notes.push('S IQ testy máš zkušenost – tzv. efekt nácviku může výsledek mírně nadhodnotit (studie uvádějí zhruba 2–6 bodů).');
  if(p.device!=='počítač')notes.push(`Test proběhl na zařízení „${p.device}“ – normy rychlostních úloh jsou proto upraveny, i tak může být rychlost mírně podhodnocená.`);
  if(p.env==='rušné')notes.push('Rušné prostředí snižuje výkon hlavně v pracovní paměti a rychlostních úlohách.');
  const totalMin=Math.round((Date.now()-S.startedAt)/60000);

  const g=gx;
  const sw=(k,type)=>{const v=R.idx[k],i=INFO[k][lvl(v)];return `<div class="it"><b>${INDEXES[k].name} · ${v}</b><span class="small">${type==='s'?g(i.p[0]):g(i.m[0])}</span></div>`};

  app.innerHTML=`<div class="fade">
  <div class="card hero">
    <div class="eyebrow">Vyhodnocení · ${esc(p.name)}, ${p.age} let</div>
    <div class="small muted">Odhadované celkové IQ</div>
    <div class="iq">${R.iq}</div>
    <div class="cat">${cat.l}</div>
    <div style="max-width:620px;margin:18px auto 0">${bellSVG(R.iq)}</div>
    <div class="kpis">
      <div class="kpi"><b>${pctTxt}. percentil</b><span>Ze 100 lidí tvého věku bys byl{|a} lepší než ${pctTxt==='> 99'?'99':pctTxt==='< 1'?'méně než 1':pctTxt}</span></div>
      <div class="kpi"><b>${ci[0]}–${ci[1]}</b><span>Pravděpodobné rozmezí (90% interval spolehlivosti)</span></div>
      <div class="kpi"><b>${totalMin} min</b><span>Celková doba testu</span></div>
    </div>
    <p style="max-width:640px;margin:22px auto 0;text-align:left">${g(cat.d)}</p>
  </div>

  <div class="card">
    <div class="eyebrow">Profil schopností</div>
    <h2>Pět oblastí myšlení</h2>
    <p class="muted small">Indexové skóre má průměr 100 a směrodatnou odchylku 15 (stejně jako IQ). Šedé pásmo 90–110 je průměr.</p>
    ${I.map(k=>profRow(INDEXES[k].name,INDEXES[k].chc,R.idx[k],INDEXES[k].color)).join('')}
    <div class="scale"><span>55</span><span>70</span><span>85</span><span>100</span><span>115</span><span>130</span><span>145</span></div>
    <div style="border-top:1px solid var(--line);margin-top:18px;padding-top:6px">
    ${profRow('GAI · obecné uvažování','verbální + fluidní + kvantitativní',R.gai,'#1d2433')}
    ${profRow('CPI · kognitivní výkonnost','pracovní paměť + rychlost',R.cpi,'#8a91a0')}
    </div>
    <p class="small muted">GAI a CPI jsou doplňkové indexy z WAIS-IV. GAI ukazuje „čisté“ uvažování bez vlivu paměti a rychlosti, CPI to, jak efektivně zpracováváš informace.</p>
  </div>

  <div class="card">
    <div class="eyebrow">Shrnutí</div>
    <h2>V čem jsi dobr{ý|á} a kde máš rezervy</h2>
    <div class="sw">
      <div class="swbox s"><h3>💪 Silné stránky</h3>${S1.map(k=>sw(k,'s')).join('')}</div>
      <div class="swbox w"><h3>🌱 Rezervy</h3>${W1.map(k=>sw(k,'w')).join('')}</div>
    </div>
    <p class="small muted" style="margin-top:12px">Silné stránky a rezervy jsou určené jak vůči populaci, tak vůči tvému vlastnímu průměru (${Math.round(meanI)}) – stejně jako to dělá psycholog při interpretaci WAIS. I člověk s vysokým IQ má oblasti, které jsou u něj relativně slabší.</p>
    ${ins.map(x=>`<div class="insight"><b>${x[0]}</b>${g(x[1])}</div>`).join('')}
  </div>

  <div class="card">
    <div class="eyebrow">Podrobný rozbor</div>
    <h2>Jednotlivé oblasti</h2>
    ${I.map(k=>{const v=R.idx[k],L_=lvl(v),inf=INFO[k],t=inf[L_];const subs=Object.keys(SUBTESTS).filter(s=>SUBTESTS[s].idx===k);
      const rel=v-meanI>=7?'<span class="tag s">relativně silná</span>':meanI-v>=7?'<span class="tag w">relativní rezerva</span>':'<span class="tag nn">v rámci tvého průměru</span>';
      return `<div class="idx"><div class="idxhead"><div><h3 style="margin:0;color:${INDEXES[k].color}">${INDEXES[k].name}</h3><div class="small muted">${INDEXES[k].chc}</div></div><div style="text-align:right"><span class="n">${v}</span><div class="small">${lvlTxt(v)} · ${Math.round(normCdf((v-100)/15)*100)}. percentil ${rel}</div></div></div>
      <p class="small muted" style="margin-top:10px"><b>Co měří:</b> ${inf.what}</p>
      <p>${g(t.t)}</p>
      <div class="pm"><div class="p"><h4>Plusy</h4><ul class="clean">${t.p.map(x=>`<li>${g(x)}</li>`).join('')}</ul></div><div class="m"><h4>Mínusy</h4><ul class="clean">${t.m.map(x=>`<li>${g(x)}</li>`).join('')}</ul></div></div>
      <div class="small" style="margin:8px 0">${subs.map(s=>`${SUBTESTS[s].name}: <b>${S.raw[s]||0}${SUBTESTS[s].max?'/'+SUBTESTS[s].max:''}</b> (vážené skóre ${R.ss[s]})`).join(' · ')}</div>
      <div class="tips"><h4>Jak rozvíjet</h4><ul class="clean">${(L_==='hi'?inf.tips.slice(0,2):inf.tips).map(x=>`<li>${g(x)}</li>`).join('')}</ul></div></div>`}).join('')}
  </div>

  <div class="card">
    <div class="eyebrow">Subtesty</div>
    <h2>Detailní výsledky</h2>
    <p class="muted small">Vážené skóre 1–19 (průměr 10, SD 3) – stejná škála jako u subtestů WAIS. 8–12 je průměr.</p>
    <div style="overflow-x:auto"><table class="sub"><thead><tr><th>Subtest</th><th>Hrubé skóre</th><th>Vážené</th><th></th></tr></thead><tbody>
    ${Object.keys(SUBTESTS).map(s=>{const v=R.ss[s];return `<tr><td>${SUBTESTS[s].name}<div class="small muted">${INDEXES[SUBTESTS[s].idx].name}</div></td><td>${S.raw[s]||0}${SUBTESTS[s].max?' / '+SUBTESTS[s].max:''}</td><td><b>${v}</b></td><td><span class="ss">${Array.from({length:19},(_,k)=>`<i class="${k<v?'f':''}"></i>`).join('')}</span></td></tr>`}).join('')}
    </tbody></table></div>
    <h3 style="margin-top:24px">Analýza chyb a stylu řešení</h3>
    ${ea.map(x=>`<div class="insight">${g(x)}</div>`).join('')}
  </div>

  <div class="card">
    <div class="eyebrow">Interpretace</div>
    <h2>Co ovlivnilo výsledek</h2>
    ${notes.map(x=>`<div class="note">${g(x)}</div>`).join('')}
    ${p.field?`<p>Obor <b>${esc(p.field)}</b>: ${R.idx.PRI>=R.idx.VCI?'tvé nejsilnější stránky leží v neverbálním uvažování – v technických a analytických profesích je to přímo využitelná výhoda.':'tvá síla v jazyce je výhodou všude, kde se pracuje s dokumentací, komunikací se zákazníky a vysvětlováním.'}</p>`:''}
    <p class="small muted">Inteligence je jen jedna z mnoha věcí, které předpovídají úspěch. Studie dlouhodobě ukazují, že svědomitost, motivace, znalosti a sociální dovednosti hrají srovnatelně velkou roli. IQ také není neměnné – v populaci roste se vzděláním (tzv. Flynnův efekt) a jednotlivé složky se dají rozvíjet.</p>
  </div>

  <div class="card">
    <div class="eyebrow">Metodika</div>
    <h2>Na čem test stojí</h2>
    <p class="small">Struktura testu kopíruje indexový model <b>WAIS-IV</b> doplněný o kvantitativní a logické uvažování podle modelu <b>CHC</b>. Hrubá skóre se převádějí na z-skóre podle orientačních věkových norem, dále na vážená skóre (1–19) a indexy (100 ± 15). Kompozitní skóre je korigováno na vzájemnou korelaci subtestů, takže nejde o pouhý průměr – stejně jako ve standardizovaných testech.</p>
    <ul class="refs">
      <li>Wechsler, D. (2008). <i>WAIS-IV: Wechsler Adult Intelligence Scale – Fourth Edition.</i> Pearson. – indexy VCI, PRI, WMI, PSI, GAI/CPI; subtesty Opakování čísel, Hledání symbolů, Kódování.</li>
      <li>Raven, J. C. (1938/1962). <i>Progressive Matrices / Advanced Progressive Matrices.</i> – maticové úlohy.</li>
      <li>Carpenter, P. A., Just, M. A., & Shell, P. (1990). What one intelligence test measures. <i>Psychological Review, 97</i>(3). – pravidla matic (progrese, distribuce tří hodnot, sčítání/odčítání čar).</li>
      <li>Shepard, R. N., & Metzler, J. (1971). Mental rotation of three-dimensional objects. <i>Science, 171.</i></li>
      <li>Smith, A. (1973). <i>Symbol Digit Modalities Test.</i> – kódování symbolů.</li>
      <li>Evans, J. St. B. T., Barston, J. L., & Pollard, P. (1983). On the conflict between logic and belief in syllogistic reasoning. <i>Memory & Cognition, 11.</i></li>
      <li>McGrew, K. S. (2009). CHC theory and the human cognitive abilities project. <i>Intelligence, 37.</i></li>
      <li>Salthouse, T. A. (2009). When does age-related cognitive decline begin? <i>Neurobiology of Aging, 30.</i> – věkové trendy.</li>
      <li>Uttal, D. H. a kol. (2013). The malleability of spatial skills. <i>Psychological Bulletin, 139.</i></li>
      <li>Melby-Lervåg, M., & Hulme, C. (2013). Is working memory training effective? <i>Developmental Psychology, 49.</i></li>
    </ul>
    <div class="note"><b>Důležité omezení:</b> Tento test nebyl standardizován na reprezentativním vzorku české populace – normy jsou orientační, odvozené z obtížnosti úloh a publikovaných výkonů v podobných testech. Výsledek ber jako kvalifikovaný odhad (typická odchylka od profesionálního testu může být ±10 bodů), ne jako psychologickou diagnózu. Přesné měření provádí pouze psycholog standardizovaným testem.</div>
  </div>

  <div class="card center">
    <div class="row" style="justify-content:center">
      <button class="btn accent" onclick="copySummary()">📋 Kopírovat souhrn</button>
      <button class="btn ghost" onclick="restart()">Udělat test znovu</button>
    </div>
  </div></div>`;
  app.innerHTML=app.innerHTML.replace(/\{([^|}<]*)\|([^}<]*)\}/g,(m,a,b)=>gx(m));
  window.scrollTo(0,0);
}
function copySummary(){
  const R=LAST,p=S.p;
  const t=`NOUS – test inteligence\n${p.name}, ${p.age} let\n\nCelkové IQ (odhad): ${R.iq} – ${category(R.iq).l}\nGAI (uvažování): ${R.gai} · CPI (výkonnost): ${R.cpi}\n\n`+Object.keys(INDEXES).map(k=>`${INDEXES[k].name}: ${R.idx[k]}`).join('\n')+'\n\nSubtesty (vážené skóre 1–19):\n'+Object.keys(SUBTESTS).map(s=>`  ${SUBTESTS[s].name}: ${R.ss[s]} (hrubé ${S.raw[s]||0}${SUBTESTS[s].max?'/'+SUBTESTS[s].max:''})`).join('\n')+'\n\nOrientační odhad, nejde o klinickou diagnostiku.';
  try{navigator.clipboard.writeText(t).then(()=>toast('Souhrn zkopírován do schránky'),()=>toast('Kopírování se nezdařilo'))}catch(e){toast('Kopírování se nezdařilo')}
}
function restart(){S={p:null,step:0,raw:{},used:{},detail:{},startedAt:null};cur=null;screenWelcome()}

/* debug: #demo shows results with simulated answers */
function demo(){S={p:{name:'Demo',age:35,gender:'m',edu:'4',field:'inženýr',native:'ano',fatigue:2,exp:'nikdy',device:'počítač',env:'klidné'},step:9,raw:{analog:10,vocab:8,matrix:9,rotate:8,series:9,logic:8,dfwd:10,dbwd:8,ssearch:33,coding:41},used:{},detail:{},startedAt:Date.now()-33*60000};prepItems();
  S.detail.logic={correct:LOGIC.map((x,k)=>k!==5)};S.detail.matrix={correct:MATS.map((m,k)=>k<9)};S.detail.series={correct:SERIES.map((x,k)=>k!==9)};S.detail.digit={maxF:7,maxB:5};S.detail.ssearch={ok:35,bad:2,n:37};screenResults()}
if(location.hash==='#demo')demo();else screenWelcome();
</script>
